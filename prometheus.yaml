global:
  scrape_interval: 1s

scrape_configs:
  - job_name: oafse-server
    static_configs:
      - targets: ["oafse-server:9100"]

  - job_name: oafse-crawler
    static_configs:
      - targets: ["oafse-crawler:9100"]

  - job_name: oafse-indexer
    static_configs:
      - targets: ["oafse-indexer:9100"]

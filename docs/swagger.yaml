basePath: /
definitions:
  json.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  json.Page:
    properties:
      description:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  json.SearchResponse:
    properties:
      pages:
        items:
          $ref: '#/definitions/json.Page'
        type: array
    type: object
host: localhost:14444
info:
  contact: {}
  description: Semantic search engine over crawled web pages.
  title: oafse Search API
  version: "1.0"
paths:
  /search:
    get:
      description: Embeds the query via SBERT and returns the most similar pages ranked
        by dot product.
      parameters:
      - description: Search query
        example: machine learning
        in: query
        name: q
        required: true
        type: string
      - description: Max results (default 10)
        example: 10
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/json.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/json.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/json.ErrorResponse'
      summary: Semantic search
      tags:
      - search
produces:
- application/json
swagger: "2.0"

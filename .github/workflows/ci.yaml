name: CI

on:
  push:
    paths:
      - "**.go"
      - "**.sql"
      - "**.yaml"
      - "Dockerfile"
  pull_request:
    paths:
      - "**.go"
      - "**.sql"
      - "**.yaml"
      - "Dockerfile"

jobs:
  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
  go-test:
    name: test
    needs: [golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Download dependencies
        run: go mod download
      - name: Go Test
        run: go test ./...

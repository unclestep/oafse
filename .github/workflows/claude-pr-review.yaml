name: Claude Review

on:
  pull_request:
    paths:
      - "**.go"
      - "**.sql"
      - "**.yaml"
      - "Dockerfile"

jobs:
  claude-review:
    name: claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a code reviewer. Analyze the following pull request and report:
              1. Potential bugs (logic errors, unhandled errors)
              2. Potential optimizations
              3. Code style issues (readability, Go idioms)

            Be concise. If nothing is found, say "No issues found."

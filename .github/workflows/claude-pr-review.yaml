name: Claude Review

on:
  pull_request:
    paths:
      - "**.go"
      - "**.sql"
      - "**.yaml"
      - "Dockerfile"

jobs:
  claude-review:
    name: claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh pr view:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh pr comment*)"
              ],
              "deny": []
              }
            }
          prompt: |
            You are a code reviewer. Review PR #${{ github.event.pull_request.number }}.
            Analyze and report:
              1. Potential bugs (logic errors, unhandled errors)
              2. Potential optimizations
              3. Code style issues (readability, Go idioms)
            Be concise. If nothing is found, say "No issues found."
            After writing the review, post it as a comment using:
            gh pr comment ${{ github.event.pull_request.number }} --body "<your review>"
